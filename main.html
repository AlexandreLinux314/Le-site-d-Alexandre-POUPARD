<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandre Poupard - Cours de Maths</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --bg-main: #f8fafc;
            --primary: #1e293b;
            --accent: #2563eb;
            --card-bg: #ffffff;
            --text: #334155;
            --text-light: #64748b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            line-height: 1.6;
        }

        /* --- HEADER --- */
        header {
            background: linear-gradient(135deg, #1e293b 0%, #3b82f6 100%);
            color: white;
            padding: 3rem 1.5rem;
            text-align: center;
        }

        header h2 {
            font-size: 1.1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
            color: #cbd5e1;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0.5rem 0;
            color: #ffffff;
            font-weight: 700;
        }

        header h4 {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.95;
            color: #e2e8f0;
        }

        /* --- CONTENU PRINCIPAL --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }

        /* --- GRILLE DES PDF (3 par ligne) --- */
        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        /* --- CARTE / RECTANGLE --- */
        .card {
            background-color: var(--card-bg);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: var(--text);
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }

        /* Effet de survol (grossissement + ombre) */
        .card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .card-tag {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* --- RESPONSIVE (POUR PORTABLES & TABLETTES) --- */
        @media (max-width: 900px) {
            .pdf-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 par ligne sur tablette */
            }
        }

        @media (max-width: 600px) {
            .pdf-grid {
                grid-template-columns: 1fr; /* 1 seul par ligne sur smartphone */
            }
            
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Bienvenue sur le site d'</h2>
        <h1>Alexandre Poupard</h1>
        <h4>Retrouvez l'ensemble de mes cours et exercices de mathématiques au format PDF.</h4>
    </header>

    <main class="container">
        <h3 class="section-title">Derniers cours et documents</h3>

        <div class="pdf-grid">

            <!-- Pour ajouter un cours, recopie ce bloc <a ...> </a> -->
            <a href="Inégalités.pdf" download class="card">
                <div class="card-title">Inégalités</div>
                
            </a>

            

        </div>
    </main>

</body>
</html>
